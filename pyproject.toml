[project]
name = "ml-production-grade-app"
version = "0.1.0"
description = "Production-oriented price prediction ML application"
readme = "README.md"
authors = [
    { name = "cheth@714", email = "chethana.virajini@aventagelabs.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",
    "colorama>=0.4.6",
    "fastapi>=0.115",
    "joblib>=1.4",
    "mlflow>=2.15",
    "numpy>=1.26",
    "openpyxl>=3.1.5",
    "pandas>=2.2",
    "pandera>=0.20",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0.3",
    "sagemaker>=2.220",
    "scikit-learn>=1.5",
    "uvicorn[standard]>=0.30",
    "xgboost>=2.1",
    "zenml>=0.64",
]

[project.scripts]
price-prediction = "price_prediction.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "price_prediction"
module-root = "src"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
log_cli = true
log_cli_level = "INFO"
